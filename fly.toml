# Fly.io config for a public demo of HookLine.
#
#   fly apps create hookline-demo
#   fly secrets set HOOKLINE_TOKEN=$(openssl rand -hex 24)
#   fly deploy
#   fly open
#
# NOTE ON STORAGE: this config deliberately does NOT mount a Fly volume, and
# HookLine stores its SQLite file in the container's own filesystem. That is on
# purpose. The image runs as the non-root `node` user, but a Fly volume is
# mounted root-owned, so SQLite could not create its file there (EACCES, crash
# loop). For a public demo, losing captured requests on each deploy is
# acceptable — arguably preferable. If you later want persistence, either drop
# `USER node` from the Dockerfile or add a root entrypoint that chowns the
# mount before dropping privileges.

app = "hookline-demo"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "4000"
  HOOKLINE_DATA = "/app/data"
  HOOKLINE_RETENTION = "7"
  NODE_ENV = "production"
  # Without this, the banner and every generated share link would point at
  # http://localhost:4000 instead of your real hostname.
  HOOKLINE_PUBLIC_URL = "https://hookline-demo.fly.dev"

# Do not bake a token into the image. Set it with:
#   fly secrets set HOOKLINE_TOKEN=$(openssl rand -hex 24)

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  # A demo is a public endpoint, so do not let a single visitor pin a machine awake.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
